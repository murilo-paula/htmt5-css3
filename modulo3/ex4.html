<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Table</title>
</head>
<body>
    <h1>table</h1>
    
    <table>

        <thead>
            
                <th scope="col">Item</th>

        <tbody>

            </tr>

            <tr>
                <td>notebook</td>

            </tr>

            <tr>
                <td>cadeira</td>

        <tfoot>
            <tr>
                <th>itens</th>

                <th>Valores</th>
            </tr>
        </tfoot>
    </table>






    <table style="margin-top: 30px;">
        <caption>minha tabela</caption>
        <thead>
            <tr>
                <th scope="col">Coluna 01</th>

        </thead>

        <tbody>
            <tr>
                <td rowspan="3">A1</td>

                <td>C3</td>
                <td>D4</td>
            </tr>
                <td>B2</td>
                <td>C2</td>
                <td>D2</td>
            <tr>
                <td colspan="3">B3</td>
            </tr>

            <tr>
                <td>A4</td>

            </tr>
        </tbody>
    </table>
