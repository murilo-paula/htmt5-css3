<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ex4.css">
    <title>Table</title>
</head>
<body>
    <h1>table</h1>
    
    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Categoria</th>
                <th>Quantidade</th>
                <th>Valor</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>celular</td>
                <td>eletronico</td>
                <td>21</td>
                <td>1200$</td>
            </tr>

            <tr>
                <td>notebook</td>
                <td>eletronico</td>
                <td>12</td>
                <td>3002</td>
            </tr>

            <tr>
                <td>cadeira</td>
                <td>movel</td>
                <td>149</td>
                <td>23</td>
            </tr>
      

            <tr>
                <td>caderno</td>
                <td>objeto</td>
                <td>596</td>
                <td>40</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>itens</td>
                <td>Categorias</td>
                <td>Quantidades</td>
                <td>Valores</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
