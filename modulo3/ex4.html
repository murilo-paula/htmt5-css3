<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ex4.css">
    <title>Table</title>
</head>
<body>
    <h1>table</h1>
    
    <table>
        <caption>Produtos</caption>
        <thead>
            <tr>
                <th scope="col">Item</th>
                <th scope="col">Categoria</th>
                <th scope="col">Quantidade</th>
                <th scope="col">Valor</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>celular</td>
                <td>eletronico</td>
                <td>21</td>
                <td>1200$</td>
            </tr>

            <tr>
                <td>notebook</td>
                <td>eletronico</td>
                <td>12</td>
                <td>3002$</td>
            </tr>

            <tr>
                <td>cadeira</td>
                <td>movel</td>
                <td>149</td>
                <td>23$</td>
            </tr>
      

            <tr>
                <td>caderno</td>
                <td>objeto</td>
                <td>596</td>
                <td>40$</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th>itens</th>
                <th>Categorias</th>
                <th>Quantidades</th>
                <th>Valores</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
