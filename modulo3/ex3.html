<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ex3.css">
    <title>Travel</title>
</head>
<body>

    <header>
        <h1>Travel</h1>

        <nav>
            <input type="search" name="search" id="search" placeholder="Search for a destination...">
        
            <ul>

                <li><a href="#">About</a></li>

        <section>
